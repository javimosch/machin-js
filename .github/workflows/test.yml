name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  MACHIN_VERSION: v0.146.3
  # machweb.src from the pinned checkout; the tests and every gate read it
  MACHIN_FRAMEWORK: ${{ github.workspace }}/.machin/framework
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.2.8"
      - name: Install SQLite headers
        run: sudo apt-get update -q && sudo apt-get install -y -q libsqlite3-dev
      - name: Fetch the pinned machin framework (machweb.src)
        uses: actions/checkout@v4
        with:
          repository: javimosch/machin
          ref: ${{ env.MACHIN_VERSION }}
          path: .machin
      - name: Install the pinned machin binary (checksum verified)
        run: |
          mkdir -p "$RUNNER_TEMP/m" && cd "$RUNNER_TEMP/m"
          gh release download "$MACHIN_VERSION" --repo javimosch/machin --pattern "machin-$MACHIN_VERSION-linux-amd64" --pattern SHA256SUMS.txt
          sha256sum --check --ignore-missing SHA256SUMS.txt
          install -m755 "machin-$MACHIN_VERSION-linux-amd64" machin
          echo "$PWD" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Transpiler, docs and parity tests
        run: deno test -A test/
      - name: Tally gate (CLI app, Deno vs native)
        run: examples/tally/test/gate.sh
      - name: Jot gate (agent-first CLI, Deno vs native, spec conformance)
        run: examples/jot/test/gate.sh
      - name: Linkbox gate (API, Deno vs native transcript)
        run: examples/linkbox/test/gate.sh
      - name: Todo gate (gold, Deno vs native, HTTP smoke; desktop is skipped without raylib)
        run: examples/todo/test/gate.sh
      - name: The getting-started page works as written (needs the commit history to clone)
        run: tools/check-getting-started.sh && tools/check-getting-started.sh source
      - name: Compile the machin-js command and check it in a clean environment
        run: tools/build-release.sh && tools/smoke-release.sh dist/machin-js

