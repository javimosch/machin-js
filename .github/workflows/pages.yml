name: docs site
on:
  push:
    branches: [main]
    paths: ["docs/**", "assets/**", "test/docs_test.ts", "transpile/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.2.8"
      - name: Check the docs' examples
        run: deno test -A test/docs_test.ts
      - name: Build
        working-directory: docs
        run: deno task build
      - name: Check links
        run: deno run --allow-read docs/_check_links.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
